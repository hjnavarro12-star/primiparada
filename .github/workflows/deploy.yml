name: Deploy to Subdomain

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci

      # Generar environment.generated.ts con secrets reales
      - name: Generate runtime environment
        run: |
          cat > src/environments/environment.generated.ts << 'EOF'
          export const runtimeEnvironment = {
            "supabaseUrl": "${{ secrets.SUPABASE_URL }}",
            "supabaseAnonKey": "${{ secrets.SUPABASE_ANON_KEY }}",
            "mapboxToken": "${{ secrets.MAPBOX_TOKEN }}"
          } as const;
          EOF
          sed -i 's/^          //' src/environments/environment.generated.ts

      - run: npm run build

      # Empaquetar frontend en un tar para subida limpia
      - name: Package frontend
        run: |
          cd dist/primiparada/browser
          tar -czf /tmp/frontend.tar.gz .

      # Empaquetar backend
      - name: Package backend
        run: |
          tar -czf /tmp/backend.tar.gz -C server --exclude=node_modules .

      # Subir tar al servidor
      - name: Upload frontend archive
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "/tmp/frontend.tar.gz"
          target: "/tmp"
          strip_components: 1
          timeout: 120s

      # Subir backend
      - name: Upload backend archive
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "/tmp/backend.tar.gz"
          target: "/tmp"
          strip_components: 1
          timeout: 120s

      # Desplegar: extraer frontend en DEPLOY_PATH, setup backend, restart
      - name: Deploy and restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            DEPLOY_PATH="${{ secrets.SSH_DEPLOY_PATH }}"

            # Limpiar frontend anterior (NO tocar server/)
            find "$DEPLOY_PATH" -maxdepth 1 -type f -delete
            rm -rf "$DEPLOY_PATH/assets" "$DEPLOY_PATH/chunk-"* "$DEPLOY_PATH/media"

            # Extraer frontend directamente en DEPLOY_PATH
            tar -xzf /tmp/frontend.tar.gz -C "$DEPLOY_PATH"
            rm -f /tmp/frontend.tar.gz

            # Verificar que index.html existe
            if [ ! -f "$DEPLOY_PATH/index.html" ]; then
              echo "ERROR: index.html no encontrado en $DEPLOY_PATH"
              exit 1
            fi

            echo "Frontend desplegado: $(ls $DEPLOY_PATH/index.html)"

            # Fijar permisos para Nginx (www-data)
            chown -R primiparada:www-data "$DEPLOY_PATH"
            chmod -R 755 "$DEPLOY_PATH"
            find "$DEPLOY_PATH" -type f -exec chmod 644 {} \;

            # Backend: extraer y reinstalar
            if [ -f /tmp/backend.tar.gz ]; then
              rm -rf "$DEPLOY_PATH/server/src" "$DEPLOY_PATH/server/package.json" "$DEPLOY_PATH/server/.env.production"
              mkdir -p "$DEPLOY_PATH/server"
              tar -xzf /tmp/backend.tar.gz -C "$DEPLOY_PATH/server"
              rm -f /tmp/backend.tar.gz
              cd "$DEPLOY_PATH/server"
              npm install --production || true
            elif [ -d "$DEPLOY_PATH/server" ]; then
              cd "$DEPLOY_PATH/server"
              npm install --production || true
            fi

            # Reiniciar servicio backend (systemd)
            sudo systemctl restart primiparada.service || true

            # Recargar Nginx para limpiar cache de proxy
            sudo systemctl reload nginx || true

            echo "Deploy completado exitosamente."
