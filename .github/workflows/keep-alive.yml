name: Keep Backend Alive

on:
  schedule:
    - cron: '0 9 * * 1,4' # Lunes y Jueves a las 9:00 AM UTC
  workflow_dispatch:

jobs:
  ping:
    name: Ping Backend API
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # Cuando haya nuevo servidor, API_URL estará configurado en secrets.
      # Este workflow hace un health check al backend para mantenerlo activo.
      - name: Ping API health
        run: |
          API="${{ secrets.API_URL }}"
          if [ -z "$API" ]; then
            echo "API_URL no configurado aún — pendiente de nuevo servidor."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API/health" || echo "000")
          echo "Health check: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Backend activo correctamente."
          else
            echo "AVISO: backend no responde (status $STATUS). Verificar servidor."
          fi
